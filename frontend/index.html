    <!-- ضبط اللغة والاتجاه قبل أول paint لمنع وميض الترجمة (FOUC) -->
    <script>
      (function () {
        try {
          var lang = localStorage.getItem('elite-cars-language');
          var theme = localStorage.getItem('elite-cars-theme');
          var html = document.documentElement;
          var useLang = lang === 'en' ? 'en' : 'ar';
          html.lang = useLang;
          html.dir = useLang === 'en' ? 'ltr' : 'rtl';
          html.dataset.language = useLang;
          if (theme) html.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
